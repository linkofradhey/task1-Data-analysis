# Server port - this is the ONE single port everything runs under
server.port=8080

# Path to the dataset CSV. Change this to point at your own dataset.
# Relative paths resolve against the directory you launch the app from
# (in STS, that's normally the project root).
app.dataset.path=sample_data.csv

# Friendly app name in logs
spring.application.name=week1-data-analysis
